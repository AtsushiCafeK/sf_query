# =====================================================================
# 稟議書ダウンローダ 設定ファイル（雛形）
#
# 使い方: このファイルを config.yaml にコピーして値を埋める。
#         config.yaml は .gitignore 対象（機密を含むため）。
#
# ★TeamSpirit本番への切り替えは、基本この "ringi:" セクションの
#   API名を差し替えるだけでよい。コード側は変更不要。
# =====================================================================

salesforce:
  # 本番組織: https://login.salesforce.com
  # Sandbox : https://test.salesforce.com
  login_url: "https://login.salesforce.com"
  api_version: "60.0"

  # 認証バックエンド:
  #   "oauth" … OAuth 2.0 認可コードフロー + PKCE（既定・本番向け）。
  #             画面右上の「Salesforceに接続」から各利用者が自分のアカウントで
  #             ログインする。下の oauth.client_id の設定が必要。
  #             接続アプリの作成手順は docs/04_oauth_setup.md を参照。
  #   "cli"   … sf CLI パススルー。接続アプリ不要で開発時にすぐ試せるが、
  #             Salesforce CLI のインストールとログインが必要。
  auth_mode: "oauth"

  # auth_mode=cli のとき使う sf の org 別名（`sf org list` の alias）
  cli_target_org: "my-dev-org"

  oauth:
    # 接続アプリの Consumer Key
    client_id: "<CONNECTED_APP_CONSUMER_KEY>"
    # PKCE公開クライアントなら空でよい。秘匿保管する構成なら設定。
    client_secret: ""
    # 接続アプリのコールバックURLと完全一致させる
    redirect_uri: "http://localhost:8080/oauth/callback"
    # ローカルコールバック受け口のポート（redirect_uriと揃える）
    callback_port: 8080
    scopes:
      - "api"
      - "refresh_token"
      - "offline_access"

# ---------------------------------------------------------------------
# 稟議書オブジェクトのマッピング
#   開発org（モック）→ 本番TeamSpirit は、ここの *_api_name を差し替える。
# ---------------------------------------------------------------------
ringi:
  object_api_name: "Ringi__c"

  # ダウンローダが使う項目マッピング（一覧表CSVの列・フォルダ名など）
  fields:
    title: "Name"
    status: "Status__c"
    application_date: "ApplicationDate__c"
    amount: "Amount__c"
    applicant: "Applicant__c"

  # 検索結果に表示する列（＝SOQLのSELECT句）。Id は自動で付与される。
  columns:
    - "Name"
    - "Status__c"
    - "ApplicationDate__c"
    - "RecordType.DeveloperName"

  # 並び順（＝SOQLのORDER BY）。この順に 001, 002 … の連番が振られる。
  order_by: "ApplicationDate__c DESC NULLS LAST"

  # ---------------------------------------------------------------
  # 検索フォームのフィルタ定義
  #
  # ★ここにブロックを1つ足すだけで、画面の入力欄と検索条件の両方が増える。
  #   Pythonコード・HTMLの変更は不要。
  #
  #   name     : フォームの項目名（英数字とアンダースコアのみ）
  #   label    : 画面に表示する名前
  #   type     : select（プルダウン） / date（カレンダー） / number（数値）
  #   field    : 検索対象のSOQL項目名
  #   operator : eq(=) ne(!=) gt(>) gte(>=) lt(<) lte(<=)
  #   options  : type=select のときの選択肢（value=保存値 / label=表示名）
  #
  #   同じ field に gte と lte の2つを定義すれば「範囲」検索になる（下記の申請日）。
  # ---------------------------------------------------------------
  filters:
    - name: record_type
      label: "レコードの種類"
      type: select
      field: "RecordType.DeveloperName"
      operator: eq
      options:
        - { value: "Purchase", label: "購買稟議" }
        - { value: "Contract", label: "契約稟議" }
        - { value: "Payment",  label: "支払稟議" }

    # 開発orgの実際の選択リスト値に合わせている（describeで確認済み）。
    # 本番TeamSpiritでは実値に差し替える。
    - name: status
      label: "ステータス"
      type: select
      field: "Status__c"
      operator: eq
      options:
        - { value: "Submitted", label: "申請中" }
        - { value: "Agree",     label: "承認" }
        - { value: "Done",      label: "完了" }

    - name: date_from
      label: "申請日（開始）"
      type: date
      field: "ApplicationDate__c"
      operator: gte

    - name: date_to
      label: "申請日（終了）"
      type: date
      field: "ApplicationDate__c"
      operator: lte

    # 追加例（コメントを外すとそのまま使える）
    # - name: amount_min
    #   label: "金額（以上）"
    #   type: number
    #   field: "Amount__c"
    #   operator: gte

  attachment_type: "files"

# ---------------------------------------------------------------------
# ダウンロード出力設定
# ---------------------------------------------------------------------
download:
  output_dir: "./downloads"
  zip: true

  # ファイルの配置:
  #   true  … レコードごとのフォルダを作る（例 001_件名_ID/請求書.pdf）。整理・保管向き
  #   false … フォルダを作らず平置き（例 001-1_件名_請求書.pdf）。
  #           全ファイルを一括選択して印刷しやすいので、印刷作業向き
  # どちらでも先頭に連番が付き、画面の一覧と同じ並び順になる。
  group_by_record: true

  # 印刷物と突き合わせるための一覧表(CSV)を出力する。
  # 連番・件名・申請日・ステータス・レコードID・ファイル名を一覧順で書き出す。
  manifest: true
